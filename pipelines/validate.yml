# Validacion del PR: secrets scan + Dockerfile lint + SCA + build + nginx config
# check + container best-practices + SBOM.
# No pushea nada. No requiere credenciales AWS.

jobs:
  - job: Validate
    displayName: Build image + nginx config check
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - script: |
          set -euo pipefail
          GITLEAKS_VERSION="v8.21.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks detect --no-git --source . --verbose --redact --exit-code 1
        displayName: Gitleaks secret scan

      - script: |
          set -euo pipefail
          HADOLINT_VERSION="v2.12.0"
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /tmp/hadolint
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/
          hadolint Dockerfile
        displayName: Hadolint Dockerfile lint

      - script: |
          set -euo pipefail
          # Trivy se usa para los 2 scans de SCA (fs + image) — instalamos una
          # sola vez aca.
          TRIVY_VERSION="0.70.0"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/
          trivy --version
        displayName: Install trivy

      - script: |
          set -euo pipefail
          # SCA a nivel source: scanea manifests de dependencies en el repo.
          # Frontend no tiene deps de codigo (HTML/nginx puro) pero corremos
          # por consistencia con backend y para detectar si algun dia se suma
          # package.json u otro manifest.
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            .
        displayName: Trivy fs scan (source SCA)

      - script: |
          set -euo pipefail

          echo "=== Build (no push) ==="
          docker build --tag app-frontend:ci-validate .

          echo "=== nginx -t (valida la config dentro del container) ==="
          # nginx -t resuelve los upstreams al startup. En CI no existe el host
          # 'app-backend', asi que le damos un alias falso a 127.0.0.1 solo para
          # que la resolucion no falle. En docker-compose y K8s el DNS real
          # resuelve correctamente sin necesidad de este truco.
          docker run --rm --add-host=app-backend:127.0.0.1 app-frontend:ci-validate nginx -t

          echo "=== index.html size ==="
          ls -la index.html
          test -s index.html
        displayName: docker build + nginx config test

      - script: |
          set -euo pipefail
          # SCA a nivel container: scan de OS packages de la imagen base
          # (nginx:alpine) + cualquier dep instalada. Misma politica que
          # trivy fs (HIGH/CRITICAL con fix upstream).
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            app-frontend:ci-validate
        displayName: Trivy image scan (container SCA)

      - script: |
          set -euo pipefail
          # Container best-practices / CIS Docker Benchmark sobre la imagen
          # buildeada. Bloquea solo en FATAL. WARN/INFO se logan pero no
          # rompen.
          DOCKLE_VERSION="0.4.15"
          curl -fsSL "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp dockle
          sudo mv /tmp/dockle /usr/local/bin/
          dockle --exit-code 1 --exit-level FATAL app-frontend:ci-validate
        displayName: Dockle (container best practices)

      - script: |
          set -euo pipefail
          # Genera Software Bill of Materials (SBOM) en formato CycloneDX-JSON.
          # No bloquea — se publica como artifact de la pipeline para auditoria
          # y vuln tracking posterior.
          SYFT_VERSION="1.44.0"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp syft
          sudo mv /tmp/syft /usr/local/bin/
          syft app-frontend:ci-validate -o cyclonedx-json=sbom.json
          echo "=== SBOM summary ==="
          syft app-frontend:ci-validate -o table | head -50
        displayName: Syft (generate SBOM)

      - task: PublishPipelineArtifact@1
        inputs:
          path: $(System.DefaultWorkingDirectory)/sbom.json
          artifact: sbom-frontend-$(Build.BuildId)
        displayName: Publish SBOM artifact
