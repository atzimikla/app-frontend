# Pipeline de CI para app-frontend.
# Spec: build + push a ECR via OIDC (aws-ecr-pusher-frontend-oidc) + bump
# del overlay dev en gitops-apps.
# Mismo patron que app-backend, solo cambia la imagen (nginx:alpine) y la SC.
#
# Validate corre en azure-pipelines-validate.yml (PRs contra develop).
# Esta pipeline solo dispara en push a develop (post-merge).

trigger:
  branches:
    include:
      - develop

pr: none

variables:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 875585125966.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_REPO: app-frontend

stages:
  - stage: BuildAndPush
    displayName: Build and Push
    jobs:
      - template: pipelines/build-and-push.yml
        parameters:
          awsRegion: $(AWS_REGION)
          ecrRegistry: $(ECR_REGISTRY)
          imageRepo: $(IMAGE_REPO)

  - stage: BumpGitops
    displayName: Bump gitops-apps with new SHA
    dependsOn: BuildAndPush
    jobs:
      - template: pipelines/bump-gitops.yml
        parameters:
          appName: app-frontend
          ecrImageUri: $(ECR_REGISTRY)/$(IMAGE_REPO)
          overlayPath: manifests/app-frontend/overlays/dev
